version = "1.0"

[s3]
services = ["__APP__-web", "__APP__-sidekiq"]
name.en = "S3 Configuration"
name.fr = "Configuration S3"

    [s3.config]
        
        [s3.config.s3_enabled]
        ask.en = "Enable S3-compatible media storage"
        ask.fr = "Activer le stockage de média compatible S3"
        type = "boolean"
        yes = "true" 
        no = "false"
        default = "false"
        bind = "S3_ENABLED:__INSTALL_DIR__/live/.env.production"

        [s3.config.s3_endpoint]
        ask = "S3 Endpoint"
        example = "https://minio.domain.tld"
        type = "string"
        default = ""
        bind = "S3_ENDPOINT:__INSTALL_DIR__/live/.env.production"
        visible = "s3_enabled"

        [s3.config.s3_bucket]
        ask = "S3 Bucket"
        type = "string"
        example = "mastodata"
        default = ""
        bind = "S3_BUCKET:__INSTALL_DIR__/live/.env.production"
        visible = "s3_enabled"

        [s3.config.s3_access_key_id]
        ask = "S3 Access Key ID"
        type = "string"
        default = ""
        bind = "AWS_ACCESS_KEY_ID:__INSTALL_DIR__/live/.env.production"
        visible = "s3_enabled"

        [s3.config.s3_access_key_secret]
        ask = "S3 Access Key Secret"
        type = "password"
        default = ""
        bind = "AWS_SECRET_ACCESS_KEY:__INSTALL_DIR__/live/.env.production"
        visible = "s3_enabled"

        [s3.config.s3_alias_host]
        ask = "S3 Alias Host"
        help = "https://docs.joinmastodon.org/admin/optional/object-storage-proxy/"
        type = "string"
        default = ""
        bind = "S3_ALIAS_HOST:/var/www/__APP__/live/.env.production"
        visible = "s3_enabled"

[oidc]
services = ["__APP__-web", "__APP__-sidekiq"]
name.en = "OpenID Connect / SSO Configuration"
name.fr = "Connexion OpenID / Configuration SSO"

    [oidc.config]

        [oidc.config.oidc_enabled]
        ask.en = "Enable OpenID Connect login (e.g. Keycloak, Authelia, Authentik, generic OIDC provider...)"
        ask.fr = "Activer la connexion via OpenID (ex.: Keycloak, Authelia, Authentik, un fournisseur OIDC générique...)"
        type = "boolean"
        yes = "true"
        no = "false"
        default = "false"
        bind = "OIDC_ENABLED:__INSTALL_DIR__/live/.env.production"

        [oidc.config.oidc_display_name]
        ask = "Button label"
        help = "Shown on the 'Log in with ...' button"
        type = "string"
        example = "Keycloak"
        default = ""
        bind = "OIDC_DISPLAY_NAME:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_issuer]
        ask = "OIDC Issuer URL"
        help = "Root URL of your identity provider, e.g. https://auth.example.com or https://keycloak.example.com/realms/myrealm"
        type = "string"
        default = ""
        bind = "OIDC_ISSUER:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_discovery]
        ask = "Use OIDC discovery"
        help = "Recommended if your provider exposes a /.well-known/openid-configuration endpoint"
        type = "boolean"
        yes = "true"
        no = "false"
        default = "false"
        bind = "OIDC_DISCOVERY:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_client_id]
        ask = "Client ID"
        type = "string"
        default = ""
        bind = "OIDC_CLIENT_ID:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_client_secret]
        ask = "Client Secret"
        type = "password"
        default = ""
        bind = "OIDC_CLIENT_SECRET:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_redirect_uri]
        ask = "Redirect URI"
        help = "Must match exactly what is registered with your identity provider. Usually https://your-mastodon-domain/auth/auth/openid_connect/callback"
        type = "string"
        default = ""
        bind = "OIDC_REDIRECT_URI:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_scope]
        ask = "Scope"
        type = "string"
        default = "openid,profile,email"
        bind = "OIDC_SCOPE:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_uid_field]
        ask = "UID field"
        help = "Which claim to match user accounts on, e.g. preferred_username or sub"
        type = "string"
        default = "preferred_username"
        bind = "OIDC_UID_FIELD:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

        [oidc.config.oidc_security_assume_email_is_verified]
        ask = "Assume email is verified"
        help = "Enable if your provider does not send an explicit email_verified claim"
        type = "boolean"
        yes = "true"
        no = "false"
        default = "false"
        bind = "OIDC_SECURITY_ASSUME_EMAIL_IS_VERIFIED:__INSTALL_DIR__/live/.env.production"
        visible = "oidc_enabled"

[translation]
name.en = "Translation"
name.fr = "Traduction"
services = ["__APP__-web", "__APP__-sidekiq"]

    [translation.deepl]
    name = "DeepL"

	    [translation.deepl.deepl_api_key]
	    ask.en = "Insert you DeepL api key"
        ask.fr = "Insérez votre clé api de DeepL"
        type = "string"
        default = ""
        bind = "DEEPL_API_KEY:__INSTALL_DIR__/live/.env.production"

	    [translation.deepl.deepl_plan]
	    ask.en = "Which DeepL plan do you have?"
        ask.fr = "Quel plan DeepL avez-vous ?"
        type = "select"
	    choices = ["free", "paid"]
	    default = "free"
	    bind = "DEEPL_PLAN:__INSTALL_DIR__/live/.env.production"
	    visible = "deepl_api_key"

    [translation.libretranslate]
    name = "LibreTranslate"

	    [translation.libretranslate.libre_translate_endpoint]
	    ask.en = "Set the LibreTranslate endpoint"
        ask.fr = "Insérez votre url LibreTranslate"
	    type = "string"
	    bind = "LIBRE_TRANSLATE_ENDPOINT:__INSTALL_DIR__/live/.env.production"

	    [translation.libretranslate.libre_translate_api_key]
	    ask.en = "Set the LibreTranslate api key"
        ask.fr = "Insérez votre clé api de LibreTranslate"
	    type = "string"
	    help.en = "Optional, if your instance requires it or if you have one"
        help.fr = "Optionnel, seulement si votre instance le requiert ou si vous en disposez d'une"
	    bind = "LIBRE_TRANSLATE_API_KEY:__INSTALL_DIR__/live/.env.production"
	    visible = "libretranslate_endpoint"
		
[misc]
name.en = "Various settings"
name.fr = "Configurations variées"
services = ["__APP__-web", "__APP__-sidekiq"]

    [misc.ldap]
    name = "LDAP"

        [misc.config.ldap_enabled]
	    ask.en = "Use LDAP users"
        ask.fr = "Utiliser les utilisateurs LDAP"
	    help.en = "Disable this if you do not want use the built-in LDAP configuration. Users will have to create an account on Mastodon to be able to access it. Do not forget to enable the option in the Mastodon Administration."
        help.fr = "Désactivez ceci si vous ne voulez pas utiliser la configuration LDAP intégrée. Les personnes devront créer un compte sur Mastodon pour pouvoir y accéder. N'oubliez pas d'activer cette option dans l'Administration de Mastodon." 
	    type = "boolean"
	    yes = "true"
	    no = "false"
	    default = "true"
	    bind = "LDAP_ENABLED:__INSTALL_DIR__/live/.env.production"

